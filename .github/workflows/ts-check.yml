name: Frontend TypeScript & Asset Build

on:
  push:
    branches:
      - 'main'
    paths:
      - '**.ts'
      - '**.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - 'tsconfig.json'
      - 'Gruntfile.js'
      - '.github/workflows/ts-check.yml'

  pull_request:
    branches:
      - 'main'
    paths:
      - '**.ts'
      - '**.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - 'tsconfig.json'
      - 'Gruntfile.js'
      - '.github/workflows/ts-check.yml'

jobs:
  typescript-check:
    name: TypeScript Check & Grunt Build
    runs-on: arc-runner-set

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript check
        run: pnpm exec tsc --noEmit

      - name: Build frontend assets (Grunt)
        run: pnpm exec grunt internal

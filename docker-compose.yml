services:
  db:
    image: mariadb:11
    container_name: fluia-espocrm-db
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root_password}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-espocrm}
      MARIADB_USER: ${MARIADB_USER:-espocrm}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-espocrm_password}
    volumes:
      - fluia-espocrm-db:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      start_period: 15s
      timeout: 10s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: fluia/espocrm:slim
    container_name: fluia-espocrm
    env_file:
      - .env
    volumes:
      - fluia-espocrm-data:/var/www/html/data
      - fluia-espocrm-custom:/var/www/html/custom
      - fluia-espocrm-client-custom:/var/www/html/client/custom
    ports:
      - "${APP_PORT:-8080}:80"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/"]
      start_period: 15s
      interval: 15s
      timeout: 10s
      retries: 3

  cron:
    build:
      context: .
      dockerfile: Dockerfile
    image: fluia/espocrm:slim
    container_name: fluia-espocrm-cron
    env_file:
      - .env
    volumes:
      - fluia-espocrm-data:/var/www/html/data
      - fluia-espocrm-custom:/var/www/html/custom
      - fluia-espocrm-client-custom:/var/www/html/client/custom
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      disable: true
    entrypoint: ["sh", "-c", "while true; do su www-data -s /bin/sh -c 'php cron.php' || true; sleep 60; done"]

volumes:
  fluia-espocrm-db:
  fluia-espocrm-data:
  fluia-espocrm-custom:
  fluia-espocrm-client-custom:

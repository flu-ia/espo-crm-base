# Runtime config. HTTP only — TLS terminates at the cluster ingress.
user www-data;
worker_processes auto;
daemon off;
error_log /dev/stderr warn;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout combined;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    client_max_body_size 50M;

    # Dynamic compression (API JSON, HTML). Prebuilt .gz handled by gzip_static.
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
        application/xml image/svg+xml;
    gzip_static on;
    gzip_vary on;

    # Cache for nginx's own open-file lookups (static assets).
    open_file_cache max=2000 inactive=60s;
    open_file_cache_valid 60s;

    # Versioned app assets (?r=<appTimestamp> cache-busting, see ClientManager.php).
    map $arg_r $client_cache_control {
        default "public, max-age=604800";
        "~.+"   "public, max-age=31536000, immutable";
    }

    server {
        listen 80 default_server;
        server_name _;

        # Real docroot (see index.php instructions + public/index.php entry).
        root /var/www/html/public;
        index index.php;

        # SPA static assets, served directly (mirrors .htaccess `^client/ - [L]`).
        location /client/ {
            alias /var/www/html/client/;
            try_files $uri =404;
            access_log off;
            add_header Cache-Control $client_cache_control always;
        }

        # REST API + portal entry points.
        location /api/v1/ {
            try_files $uri /api/v1/index.php?$query_string;
        }
        location /api/v1/portal-access {
            try_files $uri /api/v1/portal-access/index.php?$query_string;
        }
        location /portal/ {
            try_files $uri $uri/ /portal/index.php?$query_string;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            # Basic-auth API clients (mirrors .htaccess ESPO_CGI_AUTH handling).
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        }

        # Never expose internals (defense in depth; docroot already excludes them).
        location ^~ /data/        { deny all; }
        location ^~ /application/ { deny all; }
        location ^~ /custom/      { deny all; }
        location ^~ /vendor/      { deny all; }
        location ~ /\.ht          { deny all; }
    }
}

; EspoCRM production opcache. Code ships in the image, so timestamps off.
; Rebuild + restart the container to ship new code.
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1
opcache.revalidate_freq=2
opcache.jit=tracing
opcache.jit_buffer_size=64M
; opcache.preload is disabled because EspoCRM's Preload runner requires CLI SAPI
; and cannot be invoked from PHP-FPM's preload worker without crashing.
; opcache.preload=/var/www/html/preload.php
; opcache.preload_user=www-data

memory_limit=256M
max_execution_time=180
max_input_time=180
post_max_size=20M
upload_max_filesize=20M
expose_php=off
